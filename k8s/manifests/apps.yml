apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: discovery-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: DUMMY
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: ecom
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761

