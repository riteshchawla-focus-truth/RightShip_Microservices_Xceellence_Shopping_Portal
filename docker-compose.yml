services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ecom
      MYSQL_PASSWORD: ecom
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "9411:9411"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    command: ["start-dev","--import-realm"]
    environment:
      KEYCLOAK_ADMIN: kcadmin
      KEYCLOAK_ADMIN_PASSWORD: kcadmin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: ecom
      KC_DB_PASSWORD: ecom
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8088:8080"
    depends_on:
      - mysql
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - config-server
      - discovery-server
      - keycloak

  user-service:
    build: ./user-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - config-server
      - discovery-server

  product-service:
    build: ./product-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - config-server
      - discovery-server

  cart-service:
    build: ./cart-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - config-server
      - discovery-server

  order-service:
    build: ./order-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - kafka
      - config-server
      - discovery-server

  payment-service:
    build: ./payment-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - kafka
      - config-server
      - discovery-server

  messaging-service:
    build: ./messaging-service
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecom
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - mysql
      - kafka
      - config-server
      - discovery-server

volumes:
  mysql_data:
